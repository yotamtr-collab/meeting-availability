<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Availability vote</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --line: #e5e7eb;
    --line-strong: #d1d5db;
    --accent: #1f2937;
    --accent-hover: #0f172a;
    --row-hover: #f8fafc;
    --row-selected: #f1f5f9;
    --row-selected-border: #0f172a;
    --error: #b91c1c;
    --success: #047857;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--line);
    padding: 18px 24px;
  }
  .topbar-inner {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    align-items: center;
  }

  /* Logo: text wordmark by default. Replace the .brand contents with
     <img src="wix-logo.svg" alt="Wix" class="brand-img"> if you have a logo file. */
  .brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #0f172a;
    text-decoration: none;
    line-height: 1;
  }
  .brand .dot { color: #0f172a; }
  .brand .tld {
    font-weight: 600;
    color: var(--muted);
  }
  .brand-img {
    height: 24px;
    width: auto;
    display: block;
  }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 40px 40px 32px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 8px;
  }

  footer.page-footer {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 20px 48px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 15px;
  }

  label.field-label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
    color: #374151;
  }

  .field { margin-bottom: 24px; }

  input[type="text"] {
    width: 100%;
    padding: 11px 13px;
    font-size: 15px;
    font-family: inherit;
    color: var(--fg);
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.10);
  }

  .slots {
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  .slot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--line);
    transition: background 0.1s;
  }
  .slot:last-child { border-bottom: none; }
  .slot:hover { background: var(--row-hover); }
  .slot.selected {
    background: var(--row-selected);
    box-shadow: inset 3px 0 0 var(--row-selected-border);
  }

  .slot input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
    margin: 0;
  }

  .slot-text { font-size: 15px; }

  button.submit {
    margin-top: 4px;
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.submit:hover { background: var(--accent-hover); }
  button.submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .error {
    color: var(--error);
    font-size: 14px;
    margin-top: 12px;
    min-height: 20px;
  }

  /* Thank-you state */
  .thanks {
    text-align: center;
    padding: 12px 0 4px;
  }
  .thanks .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #d1fae5;
    color: var(--success);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    font-size: 28px;
  }
  .thanks h1 { margin-bottom: 8px; }
  .thanks p {
    color: var(--muted);
    margin: 0;
    font-size: 15px;
  }

  .hidden { display: none; }
</style>
</head>
<body>

<!--
  LOGO: this renders a plain text "wix.com" wordmark by default.
  If you have an actual logo file, drop it into this folder (e.g. wix-logo.svg)
  and replace the <a class="brand">…</a> below with:
    <img src="wix-logo.svg" alt="Wix" class="brand-img">
-->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="https://www.wix.com" target="_blank" rel="noopener">
      wix<span class="tld">.com</span>
    </a>
  </div>
</header>

<main>
  <div class="card">
    <div id="form-view">
      <p class="eyebrow">Availability poll</p>
      <h1 id="meeting-title"></h1>
      <p class="subtitle">Check every time you're available, then submit your response.</p>

      <div class="field">
        <label class="field-label" for="name">Your name</label>
        <input type="text" id="name" autocomplete="name" placeholder="Enter your full name" />
      </div>

      <div class="field">
        <label class="field-label">Available times</label>
        <div class="slots" id="slots"></div>
      </div>

      <button type="button" class="submit" id="submit-btn">Submit response</button>
      <div class="error" id="error"></div>
    </div>

    <div id="thanks-view" class="thanks hidden">
      <div class="check">&check;</div>
      <h1>Thank you</h1>
      <p id="thanks-message">Your response has been submitted.</p>
    </div>
  </div>
</main>

<footer class="page-footer">
  Internal scheduling tool · Please respond by the date noted in the invite.
</footer>

<script>
  // ============================================================
  // EDIT THESE FOR EACH MEETING
  // ============================================================
  const MEETING_NAME = "Q3 planning sync";

  const SLOTS = [
    "Mon May 18, 10:00–11:00 AM",
    "Mon May 18, 2:00–3:00 PM",
    "Tue May 19, 9:00–10:00 AM",
    "Tue May 19, 3:30–4:30 PM",
    "Wed May 20, 11:00 AM–12:00 PM",
    "Thu May 21, 1:00–2:00 PM",
  ];
  // ============================================================

  document.title = MEETING_NAME + " — availability";
  document.getElementById('meeting-title').textContent = MEETING_NAME;

  const slotsEl = document.getElementById('slots');
  const nameEl = document.getElementById('name');
  const errorEl = document.getElementById('error');
  const formView = document.getElementById('form-view');
  const thanksView = document.getElementById('thanks-view');
  const thanksMessage = document.getElementById('thanks-message');

  SLOTS.forEach((slot, i) => {
    const id = 'slot-' + i;
    const row = document.createElement('label');
    row.className = 'slot';
    row.htmlFor = id;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = id;
    cb.dataset.slot = String(i);
    const text = document.createElement('span');
    text.className = 'slot-text';
    text.textContent = slot;
    row.appendChild(cb);
    row.appendChild(text);
    cb.addEventListener('change', () => {
      row.classList.toggle('selected', cb.checked);
    });
    slotsEl.appendChild(row);
  });

  document.getElementById('submit-btn').addEventListener('click', () => {
    const name = nameEl.value.trim();
    if (!name) {
      errorEl.textContent = "Please enter your name.";
      nameEl.focus();
      return;
    }
    errorEl.textContent = '';

    const selectedCount = slotsEl.querySelectorAll('input[type="checkbox"]:checked').length;
    thanksMessage.textContent = selectedCount === 0
      ? `Thanks, ${name}. We've noted that none of the proposed times work for you.`
      : `Thanks, ${name}. Your ${selectedCount === 1 ? 'availability has' : 'availabilities have'} been recorded.`;

    formView.classList.add('hidden');
    thanksView.classList.remove('hidden');
    window.scrollTo(0, 0);
  });
</script>
</body>
</html>
